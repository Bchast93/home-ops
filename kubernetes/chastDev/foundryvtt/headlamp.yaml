---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app headlamp
  namespace: foundryvtt
spec:
  targetNamespace: foundryvtt

  commonMetadata:
    labels:
      app.kubernetes.io/name: *app

  components:
    - ../../../components/envoy-gateway-oidc

  dependsOn:
    - name: authelia-oidc-operator
      namespace: security
    - name: external-secrets-stores
      namespace: external-secrets

  path: ./kubernetes/base/foundryvtt/headlamp

  prune: true

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  interval: 1h
  retryInterval: 1m
  timeout: 5m

  postBuild:
    substitute:
      APP: *app
      OIDC_DESCRIPTION: Headlamp
