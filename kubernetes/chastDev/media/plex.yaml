---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # - ../../../components/volsync
    - ../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: storage
  interval: 30m
  path: ./kubernetes/base/media/plex
  patches:
    - patch: |
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: ignored
        spec:
          dataSourceRef:
            apiGroup: volsync.backube
            kind: ReplicationDestination
            name: plex-bootstrap
      target:
        kind: PersistentVolumeClaim
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 200Gi
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
