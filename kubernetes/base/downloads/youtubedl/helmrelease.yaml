---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app youtubedl
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      youtubedl:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/tzahi12345/youtubedl-material
              tag: nightly
            env:
              TZ: "${TIMEZONE}"
              write_ytdl_config: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        # annotations:
        #   gatus.home-operations.com/endpoint: |
        #     group: external
        #     alerts:
        #       - type: pushover
        ports:
          http:
            port: &port 17442
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      media:
        globalMounts:
          - path: /downloads/complete
            subPath: *app
        path: /volume1/downloads/${VAULT_PREFIX}/complete
        server: ${SYNOLOGY_HOSTNAME}
        type: nfs
      config:
        existingClaim: *app
