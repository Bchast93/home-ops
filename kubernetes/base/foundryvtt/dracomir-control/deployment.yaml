---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dracomir-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dracomir-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dracomir-control
    spec:
      serviceAccountName: dracomir-control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.14-alpine
          command: ["python", "/app/app.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PORT
              value: "8080"
            - name: K8S_NAMESPACE
              value: foundryvtt
            - name: K8S_DEPLOYMENT
              value: dracomir
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app/app.py
              subPath: app.py
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: dracomir-control
            defaultMode: 0444
